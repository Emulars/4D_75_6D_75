<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💚</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <div class="terminal-window">
            <div class="terminal-header">
                <span class="terminal-button close"></span>
                <span class="terminal-button minimize"></span>
                <span class="terminal-button maximize"></span>
                <span class="terminal-title">valentine_2026.sh</span>
            </div>
            <div class="terminal-body">
                <div class="terminal-line">
                    <span class="prompt">$</span>
                    <span class="command typing-text">./ask_valentine.sh</span>
                </div>
                <div class="output">
                    <pre class="typing-output" id="output-text"></pre>
                </div>
                <div class="valentine-message hidden" id="valentine-message">
                    <div class="heart-container">
                        <div class="heart pulse"></div>
                    </div>
                    <h1 class="glitch" data-text="Will You Be My Valentine?">Will You Be My Valentine?</h1>
                    <div class="button-container">
                        <button class="response-btn yes-btn" id="yes-btn">
                            <span class="btn-text">YES</span>
                            <span class="btn-icon">💚</span>
                        </button>
                        <button class="response-btn no-btn" id="no-btn">
                            <span class="btn-text">NO</span>
                            <span class="btn-icon">💔</span>
                        </button>
                    </div>
                </div>
                <div class="response-text hidden" id="response-text"></div>
            </div>
        </div>
    </div>

    <script src="js/matrix.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
